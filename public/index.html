<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NZ Weather</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>NZ Weather</h1>
    <p class="subtitle">Live conditions for Aotearoa, refreshed every 6 hours.</p>
  </header>

  <main class="layout">
    <section class="primary" id="primary" aria-live="polite">
      <p class="loading">Loading weather…</p>
    </section>
    <aside class="sidebar" aria-label="Other locations">
      <h2 class="sidebar-title">Locations</h2>
      <nav id="location-list" class="location-list"></nav>
    </aside>
  </main>

  <footer>
    <p>Weather data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0).</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
