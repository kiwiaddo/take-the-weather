name = "nz-weather"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 */6 * * *"]   # every 6 hours, on the hour (UTC)

[[d1_databases]]
binding = "DB"
database_name = "nz-weather-db"
database_id = "bcae3516-f49c-45ee-9bc5-3e6001ccaff4"

[assets]
directory = "./public"
binding = "ASSETS"
